    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      // `konoTheme` is the pre-rename key, kept so existing devices keep their choice.
      try {
        var t =
          localStorage.getItem('wchatTheme') || localStorage.getItem('konoTheme')
        if (t === 'dark' || t === 'midnight') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
